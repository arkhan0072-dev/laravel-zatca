name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    name: Code style and static analysis
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan (max level)
        run: vendor/bin/phpstan analyse --no-progress

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
        laravel: ["12.*", "13.*"]
        db: [sqlite, pgsql, mysql]

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.db }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zatca
          POSTGRES_PASSWORD: zatca
          POSTGRES_DB: zatca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zatca"
          --health-interval 2s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zatca
          MYSQL_DATABASE: zatca
          MYSQL_USER: zatca
          MYSQL_PASSWORD: zatca
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uzatca -pzatca"
          --health-interval 3s
          --health-retries 40

    env:
      DB_CONNECTION: ${{ matrix.db == 'sqlite' && 'testing' || matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: zatca
      DB_USERNAME: zatca
      DB_PASSWORD: zatca

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: pcov

      - run: composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction

      - run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Tests (fails below 100% coverage)
        run: vendor/bin/pest --coverage --min=100
